x-app: &app
  build: .
  env_file:
    - .env
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    <<: *app
    restart: "no"
    command:
      - python
      - migrate.py
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    command:
      - python
      - -m
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  mock-advantage:
    <<: *app
    command:
      - python
      - -m
      - uvicorn
      - mock_advantage:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/openapi.json', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    <<: *app
    command:
      - python
      - worker.py
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      ADVANTAGE_URL: http://mock-advantage:8001/api/v3/click/
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mock-advantage:
        condition: service_healthy

volumes:
  postgres_data: